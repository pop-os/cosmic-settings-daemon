[package]
name = "cosmic-settings-audio-server"
version = "1.11.0"
edition = "2024"
license = "GPL-3.0-only"
publish = true

[dependencies]
ron = "0.12"
intmap = "3.1.3"
tracing = "0.1.44"
numtoa = "1.0.1"
cosmic-config.workspace = true
cosmic-settings-daemon-config = { path = "../cosmic-settings-daemon-config", features = [
    "greeter",
] }
cosmic-pipewire = { path = "../cosmic-pipewire" }
cosmic-settings-audio-core = { path = "../audio-core" }
serde = { version = "1.0.229", features = ["derive"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
futures-util = { version = "0.3.34", features = ["sink"] }
tokio = { version = "1.54.1", features = [
    "fs",
    "macros",
    "process",
    "rt",
    "time",
] }
dirs = "7.0.0"

[dev-dependencies]
zlink = { workspace = true, features = ["tokio", "tracing"] }
