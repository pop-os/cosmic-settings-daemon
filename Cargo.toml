[package]
name = "cosmic-settings-daemon"
version = "1.11.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]
members = [
    "audio-client",
    "audio-core",
    "audio-server",
    "config",
    "cosmic-settings-daemon-config",
    "geonames",
    "cosmic-pipewire",
    "varlink-server",
]

[workspace.dependencies]
cosmic-config = { git = "https://github.com/pop-os/libcosmic" }
cosmic-theme = { git = "https://github.com/pop-os/libcosmic" }

[workspace.dependencies.zlink]
version = "0.8"
default-features = false
features = ["tokio"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
cosmic-comp-config = { git = "https://github.com/pop-os/cosmic-comp" }
cosmic-config.workspace = true
a11y-zbus = { git = "https://github.com/pop-os/dbus-settings-bindings" }
cosmic-settings-audio-server = { path = "./audio-server" }
cosmic-settings-daemon-config = { path = "./cosmic-settings-daemon-config", features = [
    "greeter",
] }
cosmic-settings-varlink-server = { path = "./varlink-server" }
cosmic-theme.export = true
cosmic-theme.workspace = true
ddc-hi = "0.4.1"
dirs = "7.0.0"
futures = "0.3.34"
futures-util = "0.3.34"
geonames = { path = "geonames" }
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false }
locale1-zbus = { git = "https://github.com/pop-os/dbus-settings-bindings" }
log = "0.4.35"
memoize = "0.6"
notify = "8.2.1"
notify-rust = "4.18.2"
serde = "1.0.229"
sunrise = "2.1.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "signal"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
udev = "0.9.3"
upower-zbus = { git = "https://github.com/pop-os/dbus-settings-bindings" }
walkdir = "2.5.0"
zbus = { version = "6.2.1", default-features = false, features = ["tokio"] }
cctk = { package = "cosmic-client-toolkit", git = "https://github.com/pop-os/cosmic-protocols" }
calloop = "0.14.5"
calloop-wayland-source = "0.4.1"

